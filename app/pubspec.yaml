name: japanese_universe
description: "일본어유니버스 - Korean speakers learn Japanese (Duolingo-style card game)"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/png/characters/
