<text x="116" y="850" font-size="10" fill="#7a8594" font-weight="600" text-anchor="start">폰: 같은 순서로 세로 스크롤(서랍 위, 입력 아래). 아이패드 1000pt 이상: 왼쪽 입력 / 오른쪽 서랍.</text>
