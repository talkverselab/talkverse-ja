name: japanese_universe
description: "일본어유니버스 — 한국 화자 일본어 학습 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  package_info_plus: ^10.2.2
  cupertino_icons: ^1.0.8

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Util
  csv: ^6.0.0
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0 # 회화 생성 음성(mp4) 재생

  # Drift (SQLite ORM)
  drift: ^2.20.3
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

  # Talkverse ID 로그인·스토어 결제(한자앱 방식, TALKVERSE_ID_APP_GUIDE.md, 2026-11-02)
  http: ^1.6.0
  flutter_web_auth_2: ^5.1.0
  flutter_secure_storage: ^11.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  in_app_purchase: ^3.3.1
  in_app_purchase_storekit: ^0.4.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift codegen
  drift_dev: ^2.20.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/data/dialogues/L1.json
    - assets/data/dialogues/_meta.json
    - assets/data/dialogues/R4/love/
    - assets/data/dialogues/R0/culture/
    - assets/data/dialogues/R0/friends/
    - assets/data/dialogues/R0/life/
    - assets/data/dialogues/R0/love/
    - assets/data/dialogues/R0/travel/
    - assets/data/dialogues/R1/culture/
    - assets/data/dialogues/R1/friends/
    - assets/data/dialogues/R1/life/
    - assets/data/dialogues/R1/love/
    - assets/data/dialogues/R1/survival/
    - assets/data/dialogues/R1/travel/
    - assets/data/dialogues/R2/culture/
    - assets/data/dialogues/R2/friends/
    - assets/data/dialogues/R2/life/
    - assets/data/dialogues/R2/love/
